name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    # Public fork PRs must not execute on the owner's computer.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 24

    runs-on: [self-hosted, Linux, X64, home-pc]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Isolate test home and preserve selected Node in login shells
        shell: bash
        run: |
          test_home="$RUNNER_TEMP/codexpro-home-${{ matrix.node }}"
          mkdir -p "$test_home"
          printf 'export PATH=%q\n' "$PATH" > "$test_home/.bash_profile"
          echo "HOME=$test_home" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Smoke Test
        run: npm run smoke

      - name: Stress Test
        run: npm run stress

      - name: Check Package Contents
        run: npm pack --dry-run

      - name: Install Packed Package
        run: npm run package:smoke

      - name: Audit Dependencies
        run: npm audit --audit-level=high
